[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-alert-deduplicator"
version = "2.0.0"
description = "Adaptive local normalization and evidence-based SOC alert deduplication."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "soc", "siem", "alert-fatigue", "incident-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
soc-alert-deduplicator = "soc_alert_deduplicator.main:main"
soc-alert-deduplicator-gui = "soc_alert_deduplicator.gui:main"
soc-alert-import-raw = "soc_alert_deduplicator.raw_import:main"
soc-alert-normalize = "soc_alert_deduplicator.universal_import:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soc_alert_deduplicator = ["assets/*.svg"]
